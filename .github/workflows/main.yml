name: DJVíťa Video APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP soubor nebyl nalezen!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/djvita-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/djvita-project"

      - name: Find Android project
        run: |
          GRADLEW=$(find "$RUNNER_TEMP/djvita-project" -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper nebyl nalezen!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          find "$PROJECT_DIR" -type f -name "*.apk" -path "*/build/outputs/*" -exec cp {} apk-output/ \;

          if [ -z "$(ls -A apk-output)" ]; then
            echo "APK nebylo vytvořeno!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJVitaVideo-APK
          path: apk-output/*.apk
